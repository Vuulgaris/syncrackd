# The public repository's checks. None needs Elektron's file, and none fetches it: the image tests run on the
# maintainer's machine before a merge (CONTRIBUTING.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Nothing that is never published
        run: python -m tools.public_check
      - name: Every Python file compiles
        run: python -m compileall -q tools emu tests
      - name: Every commit signed off
        if: github.event_name == 'pull_request'
        run: |
          bad=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
              echo "not signed off: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          exit $bad
