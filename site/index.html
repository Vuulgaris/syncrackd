<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynCrackd patcher</title>
<meta name="description" content="Make the SynCrackd OS for the Elektron Syntakt from Elektron's own 1.42 file, in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000a04; --fg: #39ff7a; --dim: #1b8c45; --hot: #c6ffd9; --line: #0f4a24; --glow: rgba(57, 255, 122, .45); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden;
         font: 17px/1.6 "Share Tech Mono", ui-monospace, "Courier New", monospace; text-transform: uppercase;
         text-shadow: 0 0 2px var(--glow), 0 0 8px rgba(57, 255, 122, .18); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3;
                 background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.32) 3px, transparent 4px); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 4;
                background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.7) 100%); }
  main { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  header { text-align: center; }
  h1 { font: inherit; font-size: 76px; line-height: 1; letter-spacing: .12em; color: var(--hot); margin: 0 0 8px;
       text-shadow: 0 0 3px var(--glow), 0 0 18px rgba(57, 255, 122, .35); }
  p { margin: 0; }
  a { color: var(--fg); }
  .dim { color: var(--dim); }
  hr { border: 0; border-top: 2px solid var(--line); margin: 18px 0; }
  ol { list-style: none; counter-reset: n; padding: 0; margin: 0; }
  ol li { counter-increment: n; margin: 0 0 10px; padding-left: 4ch; text-indent: -4ch; }
  ol li::before { content: counter(n) ".  "; color: var(--dim); }
  #drop { display: inline-block; vertical-align: top; text-indent: 0; border: 2px dashed var(--line); padding: 10px 12px; cursor: pointer; }
  #drop:hover, #drop.over, #drop:focus-within { border-color: var(--fg); }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #drop span::before { content: "> "; color: var(--dim); }
  #status { margin-top: 18px; min-height: 1.3em; }
  #status::before { content: "STATUS: "; color: var(--dim); }
  #status.ok { color: var(--hot); }
  #status.bad { color: var(--bg); background: var(--fg); text-shadow: none; padding: 0 .3ch; }
  #status.bad::before { color: var(--bg); }
  #status::after { content: ""; display: inline-block; width: .55em; height: 1em; margin-left: .2em; vertical-align: -.12em;
                   background: currentColor; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  a.button { display: none; margin-top: 12px; color: var(--bg); background: var(--fg); padding: 2px 12px;
             text-decoration: none; text-shadow: none; }
  a.button:hover, a.button:focus { background: var(--hot); outline: none; }
  @media (max-width: 560px) { body { font-size: 15px; } h1 { font-size: 46px; } }
  @media (prefers-reduced-motion: reduce) { #status::after { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>SynCrackd</h1>
    <p>OS 1.42 patcher</p>
    <p class="dim">Unofficial. At your own risk. <a href="https://github.com/Vuulgaris/syncrackd/blob/main/DISCLAIMER.md">Disclaimer</a></p>
  </header>
  <hr>
  <ol>
    <li>Back up your +Drive.</li>
    <li>Get OS 1.42 from Elektron.</li>
    <li><label id="drop"><input type="file" id="file" accept=".syx,.zip"><span>Drop the .zip or .syx</span></label></li>
    <li>Save. Flash with Transfer.</li>
  </ol>
  <p id="status" aria-live="polite">Loading</p>
  <a class="button" id="save" download>Save</a>
  <hr>
  <p class="dim">Undo: flash stock 1.42. Don't share the output. <a href="https://github.com/Vuulgaris/syncrackd">Source</a></p>
</main>

<script id="worker" type="text/js-worker">
importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
const ready = loadPyodide();
self.onmessage = async (e) => {
  try {
    const py = await ready;
    if (e.data.warm) { self.postMessage({ warm: true }); return; }
    py.FS.writeFile("/os.syx", new Uint8Array(e.data.syx));
    py.globals.set("SCRIPT", e.data.script);
    const out = py.runPython(`
g = {"__name__": "syncrackd_web", "__file__": "/syncrackd.py"}
exec(compile(SCRIPT, "syncrackd.py", "exec"), g)
patch = g["_install"]()
import base64, json, zlib
fw = patch.fw
bundle = json.loads(zlib.decompress(base64.b85decode("".join(g["_BUNDLE"].split()))))
def unzip(path):
    import io, zipfile
    with open(path, "rb") as f:
        data = f.read()
    if data[:4] != b"PK\\x03\\x04":
        return
    z = zipfile.ZipFile(io.BytesIO(data))
    names = [n for n in z.namelist() if n.lower().endswith(".syx") and not n.startswith("__MACOSX/")
             and not n.rsplit("/", 1)[-1].startswith("._")]
    if not names:
        raise fw.GuardError("no .syx in this zip")
    picked = [z.read(n) for n in names]
    known = [b for b in picked if fw.sha256(b) in fw.KNOWN]
    with open(path, "wb") as f:
        f.write((known or picked)[0])
try:
    unzip("/os.syx")
    raw = patch.apply(fw.load("/os.syx"), bundle)
    result = (True, raw, fw.sha256(raw), bundle["image"])
except fw.GuardError as e:
    result = (False, None, str(e), bundle["image"])
result
`);
    const [ok, raw, text, image] = out.toJs();
    out.destroy();
    if (ok) {
      const bytes = raw.slice();
      self.postMessage({ ok: true, out: bytes, sha: text, image }, [bytes.buffer]);
    } else {
      self.postMessage({ ok: false, err: text });
    }
  } catch (err) {
    self.postMessage({ ok: false, err: String(err.message || err).split("\n").slice(-2).join(" ") });
  }
};
</script>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const status = (text, cls) => { $("status").textContent = text; $("status").className = cls || ""; };
  const release = await fetch("release.json").then((r) => r.json());
  const script = await fetch(release.file).then((r) => r.text());

  const src = $("worker").textContent;
  const worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
  let busy = true, started = 0, tick = null;
  worker.postMessage({ warm: true });

  worker.onmessage = (e) => {
    if (e.data.warm) { busy = false; status("Ready."); return; }
    clearInterval(tick); busy = false;
    if (!e.data.ok) { status(/unknown file hash/.test(e.data.err) ? "Not OS 1.42." : e.data.err, "bad"); return; }
    const match = e.data.sha === release.output;
    window.lastResult = { sha: e.data.sha, match, bytes: e.data.out.length };
    if (!match) { status("Failed. Don't flash.", "bad"); return; }
    $("save").href = URL.createObjectURL(new Blob([e.data.out], { type: "application/octet-stream" }));
    $("save").download = "syncrackd.syx";
    $("save").style.display = "inline-block";
    status("Done.", "ok");
  };

  window.patchBytes = (buf) => {
    if (busy) { status("Busy."); return; }
    busy = true; started = Date.now(); $("save").style.display = "none";
    tick = setInterval(() => status("Patching... " + Math.round((Date.now() - started) / 1000) + "s"), 500);
    worker.postMessage({ syx: buf, script }, [buf]);
  };

  const take = (f) => f && f.arrayBuffer().then(window.patchBytes);
  $("file").addEventListener("change", (e) => take(e.target.files[0]));
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over");
                                         take(e.dataTransfer.files[0]); });
  status("Loading...");
})();
</script>
</body>
</html>
